name: Keep Streamlit apps awake

on:
  schedule:
    - cron: "0 */10 * * *"
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Wake apps (from data/projects.json)
        run: python scripts/wake_from_data.py
